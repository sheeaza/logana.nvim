name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # latest release, plus nightly to catch upcoming breakage early
        nvim: [v0.12.6, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Run tests
        run: nvim --headless -u NONE -l tests/run.lua
